[project]
name = "zhegutian-eval"
version = "0.2.0"
description = "鹧鸪天评测集"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.2.0",
    "openai>=2.36.0",
    "pydantic>=2.13.3",
    "pypinyin>=0.55.0",
    "python-dotenv>=1.2.2",
    "tabulate>=0.10.0",
]

[project.scripts]
zhegutian = "src.main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "utils*", "tools*"]
